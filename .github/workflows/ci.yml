name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Format check
        run: uv run ruff format --check src/

      - name: Lint
        run: uv run ruff check src/

      - name: Type check
        run: uv run mypy src/adk_patterns/

      - name: Run all pattern tests
        run: |
          FAILED=0
          for dir in examples/*/; do
            echo "Testing $dir..."
            uv run pytest "$dir" -q --tb=short || FAILED=$((FAILED + 1))
          done
          echo "Failed: $FAILED"
          exit $FAILED

  benchmark:
    runs-on: ubuntu-latest
    needs: verify
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --extra dev
      - run: uv run python scripts/verify_examples.py --benchmark
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark
          path: artifacts/pattern-benchmark.json
